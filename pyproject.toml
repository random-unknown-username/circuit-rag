[build-system]
requires = ["setuptools>=61.0", "torch", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-rag"
version = "0.1.0"
description = "Exact, certified GPU vector search for RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "sentence-transformers>=2.2.0",
]
